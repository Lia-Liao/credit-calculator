<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 信用卡借款计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #1890ff;
            font-size: 28px;
        }
        .section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1890ff;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #1890ff;
            color: white;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-success {
            background: #52c41a;
            color: white;
        }
        .btn-success:hover {
            background: #73d13d;
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .btn-secondary {
            background: #e8e8e8;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d9d9d9;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-large {
            padding: 12px 30px;
            font-size: 16px;
        }
        .card-item {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #fafafa;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #1890ff;
        }
        .card-actions {
            display: flex;
            gap: 10px;
        }
        .products-section {
            margin-top: 15px;
        }
        .product-item {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .product-type {
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 14px;
        }
        .product-type.bill {
            background: #e6f7ff;
            color: #1890ff;
        }
        .product-type.cash {
            background: #f6ffed;
            color: #52c41a;
        }
        .product-amount {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .terms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .term-item {
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            text-align: center;
        }
        .term-months {
            font-size: 20px;
            font-weight: bold;
            color: #1890ff;
        }
        .term-rate {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
        }
        .add-product-trigger, .edit-product-trigger {
            background: white;
            border: 2px dashed #1890ff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #1890ff;
            font-weight: 500;
        }
        .add-product-trigger:hover, .edit-product-trigger:hover {
            background: #e6f7ff;
        }
        .product-form {
            background: white;
            border: 2px solid #1890ff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }
        .term-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
        }
        .divider {
            height: 1px;
            background: #e8e8e8;
            margin: 15px 0;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .hidden {
            display: none !important;
        }
        .add-card-form {
            background: white;
            border: 2px solid #52c41a;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏦 信用卡管理后台</h1>
            <button class="btn btn-primary btn-large" onclick="toggleAddCardForm()">➕ 添加信用卡</button>
        </div>
        
        <div id="add-card-form-container" class="hidden"></div>
        
        <div id="cards-container"></div>
    </div>
    
    <script>
        const API_BASE = '/api';
        let allCards = [];
        
        async function apiRequest(endpoint, options = {}) {
            const url = `${API_BASE}${endpoint}`;
            const config = {
                headers: { 'Content-Type': 'application/json' },
                ...options
            };
            const res = await fetch(url, config);
            return res.json();
        }
        
        async function loadCards() {
            const result = await apiRequest('/credit-cards');
            if (result.code === 0) {
                allCards = result.data;
                renderCards();
            }
        }
        
        function renderCards() {
            const container = document.getElementById('cards-container');
            
            if (allCards.length === 0) {
                container.innerHTML = '<div class="section"><p style="text-align: center; color: #666; padding: 40px;">暂无信用卡数据，请点击顶部"添加信用卡"按钮</p></div>';
                return;
            }
            
            container.innerHTML = allCards.map(card => `
                <div class="section card-item" id="card-${card.id}">
                    <div class="card-header">
                        <span class="card-title">${card.bankName}</span>
                        <div class="card-actions">
                            <button class="btn btn-danger btn-small" onclick="deleteCard(${card.id})">删除</button>
                        </div>
                    </div>
                    
                    <div class="products-section">
                        ${renderProducts(card)}
                        
                        <div class="add-product-trigger" onclick="toggleAddProduct(${card.id})">
                            ➕ 添加分期产品
                        </div>
                        
                        <div id="add-product-form-${card.id}" class="product-form hidden">
                            ${renderProductForm(card.id, 'add')}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderProducts(card) {
            if (!card.products || card.products.length === 0) {
                return '';
            }
            
            const billProducts = card.products.filter(p => p.productType === 'bill');
            const cashProducts = card.products.filter(p => p.productType === 'cash');
            
            let html = '';
            
            if (billProducts.length > 0) {
                html += renderProductGroup(card, billProducts, 'bill', '账单分期');
            }
            
            if (cashProducts.length > 0) {
                html += renderProductGroup(card, cashProducts, 'cash', '现金分期');
            }
            
            return html;
        }
        
        function renderProductGroup(card, products, type, typeName) {
            const firstProduct = products[0];
            let amountDisplay = '';
            
            if (type === 'bill') {
                amountDisplay = `账单出账金额: ¥${Number(firstProduct.billAmount).toFixed(2)}`;
            } else {
                amountDisplay = `金额范围: ¥${Number(firstProduct.minAmount).toFixed(2)} - ¥${Number(firstProduct.maxAmount).toFixed(2)}`;
            }
            
            return `
                <div class="product-item" id="product-display-${card.id}-${type}">
                    <div class="product-header">
                        <span class="product-type ${type}">${typeName}</span>
                        <button class="btn btn-primary btn-small" onclick="toggleEditProduct(${card.id}, '${type}')">编辑</button>
                    </div>
                    <div class="product-amount">${amountDisplay}</div>
                    <div class="terms-grid">
                        ${products.map(p => `
                            <div class="term-item">
                                <div class="term-months">${p.term}期</div>
                                <div class="term-rate">年化 ${(p.rate * 100).toFixed(2)}%</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="actions">
                        <button class="btn btn-danger btn-small" onclick="deleteProductGroup(${card.id}, '${type}')">删除该组产品</button>
                    </div>
                </div>
                
                <div id="edit-product-form-${card.id}-${type}" class="product-form hidden">
                    ${renderProductForm(card.id, 'edit', type, products)}
                </div>
            `;
        }
        
        function renderProductForm(cardId, mode, type = null, products = null) {
            let formType = type || 'bill';
            let billAmountValue = 10000;
            let minAmountValue = 1000;
            let maxAmountValue = 50000;
            let termsHtml = '';
            
            if (mode === 'edit' && products && products.length > 0) {
                const firstProduct = products[0];
                if (firstProduct.productType === 'bill') {
                    billAmountValue = firstProduct.billAmount;
                } else {
                    minAmountValue = firstProduct.minAmount;
                    maxAmountValue = firstProduct.maxAmount;
                }
                
                termsHtml = products.map((p, index) => `
                    <div class="term-inputs" data-index="${index}">
                        <div class="form-group">
                            <label>期数（月）</label>
                            <input type="number" class="term-input" value="${p.term}" min="1">
                        </div>
                        <div class="form-group">
                            <label>年化利率（小数）</label>
                            <input type="number" class="rate-input" step="0.0001" value="${p.rate}">
                        </div>
                        <button type="button" class="btn btn-secondary btn-small" onclick="removeTermInput(this)" style="margin-bottom: 15px;">删除</button>
                    </div>
                `).join('');
            } else {
                termsHtml = `
                    <div class="term-inputs" data-index="0">
                        <div class="form-group">
                            <label>期数（月）</label>
                            <input type="number" class="term-input" value="3" min="1">
                        </div>
                        <div class="form-group">
                            <label>年化利率（小数）</label>
                            <input type="number" class="rate-input" step="0.0001" value="0.045">
                        </div>
                        <button type="button" class="btn btn-secondary btn-small" onclick="removeTermInput(this)" style="margin-bottom: 15px;">删除</button>
                    </div>
                `;
            }
            
            const typeSelectDisabled = mode === 'edit' ? 'disabled' : '';
            
            return `
                <div class="form-grid">
                    <div class="form-group">
                        <label>产品类型</label>
                        <select class="product-type-select" ${typeSelectDisabled}>
                            <option value="bill" ${formType === 'bill' ? 'selected' : ''}>账单分期</option>
                            <option value="cash" ${formType === 'cash' ? 'selected' : ''}>现金分期</option>
                        </select>
                    </div>
                </div>
                
                <div class="bill-amount-section ${formType === 'cash' ? 'hidden' : ''}">
                    <div class="form-group">
                        <label>账单出账金额</label>
                        <input type="number" class="bill-amount-input" step="0.01" value="${billAmountValue}">
                    </div>
                </div>
                
                <div class="cash-amount-section ${formType === 'bill' ? 'hidden' : ''}">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>最低借款金额</label>
                            <input type="number" class="min-amount-input" step="0.01" value="${minAmountValue}">
                        </div>
                        <div class="form-group">
                            <label>最高借款金额</label>
                            <input type="number" class="max-amount-input" step="0.01" value="${maxAmountValue}">
                        </div>
                    </div>
                </div>
                
                <div class="divider"></div>
                <h4>期数和利率配置</h4>
                
                <div class="terms-container">
                    ${termsHtml}
                </div>
                
                <div class="actions">
                    <button type="button" class="btn btn-secondary btn-small" onclick="addTermInputToForm(this)">➕ 添加更多期数</button>
                    <button type="button" class="btn btn-secondary" data-mode="${mode}" data-card-id="${cardId}" data-type="${type}" onclick="cancelAction(this)">取消</button>
                    <button type="button" class="btn btn-success" data-mode="${mode}" data-card-id="${cardId}" data-type="${type}" onclick="submitAction(this)">
                        ${mode === 'add' ? '添加产品' : '保存修改'}
                    </button>
                </div>
            `;
        }
        
        function toggleAddCardForm() {
            const container = document.getElementById('add-card-form-container');
            
            if (container.classList.contains('hidden')) {
                container.innerHTML = `
                    <div class="add-card-form">
                        <h3 style="margin-bottom: 15px; color: #52c41a;">➕ 添加新信用卡</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>银行名称</label>
                                <input type="text" id="new-bank-name" placeholder="例如：招商银行">
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn btn-secondary" onclick="toggleAddCardForm()">取消</button>
                            <button class="btn btn-success" onclick="addNewCard()">确认添加</button>
                        </div>
                    </div>
                `;
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }
        
        function toggleAddProduct(cardId) {
            const form = document.getElementById(`add-product-form-${cardId}`);
            form.classList.toggle('hidden');
        }
        
        function toggleEditProduct(cardId, type) {
            const display = document.getElementById(`product-display-${cardId}-${type}`);
            const form = document.getElementById(`edit-product-form-${cardId}-${type}`);
            
            if (form.classList.contains('hidden')) {
                display.classList.add('hidden');
                form.classList.remove('hidden');
            } else {
                display.classList.remove('hidden');
                form.classList.add('hidden');
            }
        }
        
        function addTermInputToForm(btn) {
            const container = btn.closest('.product-form').querySelector('.terms-container');
            const template = container.querySelector('.term-inputs').cloneNode(true);
            template.querySelectorAll('input').forEach(input => input.value = input.classList.contains('term-input') ? '6' : '0.045');
            container.appendChild(template);
        }
        
        function removeTermInput(btn) {
            const container = btn.parentElement.parentElement;
            if (container.children.length > 1) {
                btn.parentElement.remove();
            }
        }
        
        function cancelAction(btn) {
            const mode = btn.dataset.mode;
            const cardId = parseInt(btn.dataset.cardId);
            const type = btn.dataset.type;
            
            if (mode === 'add') {
                toggleAddProduct(cardId);
            } else {
                toggleEditProduct(cardId, type);
            }
        }
        
        async function submitAction(btn) {
            const mode = btn.dataset.mode;
            const cardId = parseInt(btn.dataset.cardId);
            const type = btn.dataset.type;
            
            if (mode === 'add') {
                await submitAddProduct(cardId);
            } else {
                await submitEditProduct(cardId, type);
            }
        }
        
        async function addNewCard() {
            const bankName = document.getElementById('new-bank-name').value;
            if (!bankName) {
                alert('请输入银行名称');
                return;
            }
            
            const data = {
                bankName: bankName,
                products: []
            };
            
            const result = await apiRequest('/credit-cards', {
                method: 'POST',
                body: JSON.stringify(data)
            });
            
            if (result.code === 0) {
                toggleAddCardForm();
                loadCards();
            }
        }
        
        async function submitAddProduct(cardId) {
            const cardElement = document.getElementById(`card-${cardId}`);
            const form = document.getElementById(`add-product-form-${cardId}`);
            
            const type = form.querySelector('.product-type-select').value;
            const card = allCards.find(c => c.id === cardId);
            
            const termInputs = form.querySelectorAll('.term-input');
            const rateInputs = form.querySelectorAll('.rate-input');
            
            const maxProductId = card.products.length > 0 ? Math.max(...card.products.map(p => p.id)) : 0;
            let productId = maxProductId + 1;
            
            let billAmount = null;
            let minAmount = null;
            let maxAmount = null;
            
            if (type === 'bill') {
                billAmount = parseFloat(form.querySelector('.bill-amount-input').value);
                minAmount = billAmount;
                maxAmount = billAmount;
            } else {
                minAmount = parseFloat(form.querySelector('.min-amount-input').value);
                maxAmount = parseFloat(form.querySelector('.max-amount-input').value);
            }
            
            for (let i = 0; i < termInputs.length; i++) {
                const term = parseInt(termInputs[i].value);
                const rate = parseFloat(rateInputs[i].value);
                
                const product = {
                    id: productId++,
                    productType: type,
                    enabled: true,
                    term: term,
                    rate: rate,
                    minAmount: minAmount,
                    maxAmount: maxAmount
                };
                
                if (type === 'bill') {
                    product.billAmount = billAmount;
                } else {
                    product.minAmount = minAmount;
                    product.maxAmount = maxAmount;
                }
                
                card.products.push(product);
            }
            
            const result = await apiRequest(`/credit-cards/${cardId}`, {
                method: 'PUT',
                body: JSON.stringify({ products: card.products })
            });
            
            if (result.code === 0) {
                alert('产品添加成功！');
                toggleAddProduct(cardId);
                loadCards();
            }
        }
        
        async function submitEditProduct(cardId, type) {
            const card = allCards.find(c => c.id === cardId);
            const cardElement = document.getElementById(`card-${cardId}`);
            const form = document.getElementById(`edit-product-form-${cardId}-${type}`);
            
            const termInputs = form.querySelectorAll('.term-input');
            const rateInputs = form.querySelectorAll('.rate-input');
            
            let newBillAmount = null;
            let newMinAmount = null;
            let newMaxAmount = null;
            
            if (type === 'bill') {
                newBillAmount = parseFloat(form.querySelector('.bill-amount-input').value);
            } else {
                newMinAmount = parseFloat(form.querySelector('.min-amount-input').value);
                newMaxAmount = parseFloat(form.querySelector('.max-amount-input').value);
            }
            
            card.products = card.products.filter(p => p.productType !== type);
            
            const maxProductId = card.products.length > 0 ? Math.max(...card.products.map(p => p.id)) : 0;
            let productId = maxProductId + 1;
            
            for (let i = 0; i < termInputs.length; i++) {
                const term = parseInt(termInputs[i].value);
                const rate = parseFloat(rateInputs[i].value);
                
                const product = {
                    id: productId++,
                    productType: type,
                    enabled: true,
                    term: term,
                    rate: rate
                };
                
                if (type === 'bill') {
                    product.billAmount = newBillAmount;
                    product.minAmount = newBillAmount;
                    product.maxAmount = newBillAmount;
                } else {
                    product.minAmount = newMinAmount;
                    product.maxAmount = newMaxAmount;
                }
                
                card.products.push(product);
            }
            
            const result = await apiRequest(`/credit-cards/${cardId}`, {
                method: 'PUT',
                body: JSON.stringify({ products: card.products })
            });
            
            if (result.code === 0) {
                alert('保存成功！');
                toggleEditProduct(cardId, type);
                loadCards();
            }
        }
        
        async function deleteCard(id) {
            if (confirm('确定删除这张信用卡及其所有分期产品吗？')) {
                await apiRequest(`/credit-cards/${id}`, { method: 'DELETE' });
                loadCards();
            }
        }
        
        async function deleteProductGroup(cardId, type) {
            if (confirm('确定删除这组分期产品吗？')) {
                const card = allCards.find(c => c.id === cardId);
                card.products = card.products.filter(p => p.productType !== type);
                
                await apiRequest(`/credit-cards/${cardId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ products: card.products })
                });
                
                loadCards();
            }
        }
        
        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('product-type-select')) {
                const form = e.target.closest('.product-form');
                const type = e.target.value;
                const billSection = form.querySelector('.bill-amount-section');
                const cashSection = form.querySelector('.cash-amount-section');
                
                if (type === 'bill') {
                    billSection.classList.remove('hidden');
                    cashSection.classList.add('hidden');
                } else {
                    billSection.classList.add('hidden');
                    cashSection.classList.remove('hidden');
                }
            }
        });
        
        loadCards();
    </script>
</body>
</html>
